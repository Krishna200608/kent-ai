[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kent-ai"
version = "0.1.0"
description = "AI-Powered Clinical Assistant for Homeopathic Repertorization based on Kent's Repertory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kent-AI Team", email = "research@iiita.ac.in" }
]
keywords = [
    "homeopathy",
    "repertorization",
    "clinical-nlp",
    "named-entity-recognition",
    "information-retrieval",
    "llm",
    "clinicalbert"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.35",
    "datasets>=2.14",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "ollama>=0.1",
    "streamlit>=1.64.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "scikit-learn>=1.3",
    "seqeval>=1.2",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "ipykernel>=6.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length handled by black and long clinical prompt strings
    "E402",  # Module level import not at top of file (scripts adjust sys.path for standalone run)
    "F401",  # Unused imports across test fixtures and package __init__ files
    "F841",  # Local variable assigned but unused
    "E722",  # Bare except in legacy error catch blocks
    "W291",  # Trailing whitespace
    "W293",  # Blank line contains whitespace
]

