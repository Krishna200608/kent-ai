# LLaMA 3 Synthetic Case Generation Configuration
generation:
  model: "llama3:8b"
  backend: "ollama"           # ollama | huggingface | vllm
  api_base: "http://localhost:11434"
  temperature: 0.7
  top_p: 0.9
  max_tokens: 512
  seed: 42

target_data:
  section_id: 1               # MIND section in Kent's Repertory
  rubric_count: 4933          # Number of distinct rubrics in MIND
  cases_per_rubric: 4         # Target ~19,700 - 22,200 total cases
  output_file: "data/processed/mind_cases.jsonl"
  checkpoint_file: "data/processed/generation_checkpoint.json"
  checkpoint_interval: 25     # Save state every 25 generated cases

splits:
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  seed: 42
  stratify_by_rubric: true
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"
  test_file: "data/processed/test.jsonl"
