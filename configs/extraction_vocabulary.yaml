# =============================================================================
# LLaMA Structured Slot Extraction (Tier 3)
# Used as verification/enrichment after heuristic + ClinicalBERT passes
# =============================================================================
llm_extraction:
  enabled: true
  # Only invoke LLaMA slot extraction when utterance word count exceeds this
  min_word_count: 4
  # Extraction system prompt injected alongside the main chatbot system prompt
  slot_extraction_suffix: |
    ADDITIONALLY: After your conversational reply, on a new line, output a SLOT_UPDATE JSON object
    strictly extracting ONLY what the patient JUST said in their last message.
    Do NOT hallucinate or infer beyond what they explicitly stated.
    Format exactly:
    SLOT_UPDATE: {"location": [], "sensation": [], "modality_agg": [], "modality_amel": [], "concomitant": [], "temporal": [], "mental": []}
    Leave arrays empty [] if that dimension was not mentioned. Use lowercase strings.

# =============================================================================
# Generate Repertorization Button — unlock condition
# =============================================================================
generate_button:
  # Minimum number of Kent dimensions that must be captured before the
  # 'Generate Repertorization' button unlocks. Set to 1 to unlock as soon
  # as any complaint is registered.
  min_dimensions_to_unlock: 1
